<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kage — X graphic 10-06</title>
<style>
  /* Kage light tokens, same system as the v1 graphic. 1600×900 for X.
     Numbers: Envio indexer, all 4 Kuru markets, 24h to 2026-10-06 14:00 UTC. */
  @font-face { font-family: "Geist"; font-weight: 400; src: url("../kage-promo/assets/fonts/Geist_400Regular.ttf"); }
  @font-face { font-family: "Geist"; font-weight: 600; src: url("../kage-promo/assets/fonts/Geist_600SemiBold.ttf"); }
  @font-face { font-family: "Geist"; font-weight: 800; src: url("../kage-promo/assets/fonts/Geist_800ExtraBold.ttf"); }
  @font-face { font-family: "Geist Mono"; font-weight: 400; src: url("../kage-promo/assets/fonts/GeistMono_400Regular.ttf"); }
  @font-face { font-family: "KageMark"; src: url("../kage-promo/assets/fonts/KageMark-Black.ttf"); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body { background: #FBFAF9; color: #0E100F; font-family: "Geist", sans-serif; position: relative; }
  .wash { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(91,65,224,.12), rgba(91,65,224,0)); }
  .mono { font-family: "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; }
  .accent { color: #5B41E0; }
  .berry { color: #A0055D; }

  .kicker { position: absolute; left: 72px; top: 64px; font-size: 16px; color: #6B6579; }
  .brand { position: absolute; left: 72px; top: 112px; display: flex; align-items: center; gap: 18px; }
  .mark { position: relative; width: 64px; height: 64px; }
  .mark span { position: absolute; left: 0; top: 0; font-family: "KageMark", serif; font-size: 64px; line-height: 1; }
  .mark .sh { color: #5B41E0; transform: translate(6px, 6px); }
  .name { font-size: 44px; font-weight: 800; letter-spacing: -.05em; }

  .stat { position: absolute; left: 68px; top: 214px; font-size: 150px; font-weight: 800; letter-spacing: -.055em; line-height: .9; }
  .statline { position: absolute; left: 74px; top: 366px; font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1.12; color: #45404E; width: 760px; }

  .bar { position: absolute; left: 74px; top: 498px; width: 740px; }
  .track { display: flex; height: 26px; border-radius: 8px; overflow: hidden; gap: 4px; }
  .seg { height: 100%; }
  .seg.bot { width: 36.8%; background: #A0055D; border-radius: 8px 0 0 8px; }
  .seg.real { flex: 1; background: #5B41E0; opacity: .85; border-radius: 0 8px 8px 0; }
  .legend { display: flex; justify-content: space-between; margin-top: 14px; font-size: 13.5px; color: #6B6579; }
  .legend b { font-weight: 400; }

  .turn { position: absolute; left: 72px; top: 612px; font-size: 64px; font-weight: 800; letter-spacing: -.045em; line-height: 1.02; }
  .foot { position: absolute; left: 72px; bottom: 60px; font-size: 15px; color: #6B6579; }

  .phone { position: absolute; width: 300px; height: 650px; border-radius: 40px; padding: 8px; background: #E6E0D9;
    box-shadow: 0 0 0 1px rgba(14,16,15,.14), 0 50px 90px -40px rgba(14,16,15,.35), 0 0 120px -40px rgba(91,65,224,.25); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 32px; display: block; }
  .p1 { right: 400px; top: 110px; }
  .p2 { right: 72px; top: 150px; transform: rotate(3deg); }
  .pill { position: absolute; right: 118px; bottom: 56px; font-size: 15px; color: #0B7D56; border: 1.5px solid rgba(11,125,86,.35);
    background: rgba(11,125,86,.06); border-radius: 999px; padding: 12px 20px; }
</style>
</head>
<body>
  <div class="wash" style="left:-220px;top:160px;width:1000px;height:760px"></div>

  <div class="stat"><span class="berry">22</span> wallets</div>

    <div class="track"><div class="seg bot"></div><div class="seg real"></div></div>

      <span class="berry">22 bots · 37%</span>

  <div class="foot mono">Every Kuru trade, indexed by Envio · 4 markets · Monad mainnet</div>

  <div class="phone p1"><img src="assets/screen-smart-24h.png" alt=""></div>

</html>
